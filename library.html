<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookly | Library</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="loader-container">
        <div class="book-loader"><div class="cover left"></div><div class="page"></div><div class="page"></div><div class="page"></div><div class="cover right"></div></div>
    </div>

    <header class="header">
        <div class="header-1">
            <a href="index.html" class="logo"><i class="fas fa-book-open"></i> bookly</a>
            
            <form action="" class="search-form">
                <input type="search" placeholder="Search by title, author, or category..." id="search-box">
                <label for="search-box" class="fas fa-search"></label>
                <div id="search-results" class="search-results-container hidden"></div>
            </form>

            <div class="icons">
                <i class="fas fa-moon" id="theme-toggle"></i>
            </div>
        </div>
        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="library.html" class="active">Library</a>
            <a href="explore.html">Explore</a>
            <a href="support.html">Support</a>
        </nav>
    </header>

    <main>
        <section id="favorites" style="background: var(--card-bg);">
            <h2 class="heading"><span>My Favorites</span></h2>
            <div class="book-grid" id="favorites-container"></div>
        </section>

        <section class="all-books">
            <h2 class="heading"><span>Complete Collection</span></h2>
            
            <div class="filter-menu">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="math">Mathematics</button>
                <button class="filter-btn" data-filter="science">Science</button>
                <button class="filter-btn" data-filter="english">English/Lit</button>
            </div>

            <div class="book-grid" id="library-container"></div>
        </section>
    </main>

    <div id="book-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            <div class="modal-body">
                <img id="modal-img" src="" alt="Book Cover">
                <div class="modal-info">
                    <h2 id="modal-title">Book Title</h2>
                    <p class="author-line">By <span id="modal-author"></span> &bull; <span id="modal-pages"></span> Pages</p>
                    <p id="modal-desc" class="description"></p>
                    <div class="modal-actions">
                        <a href="#" id="modal-read-btn" class="btn" target="_blank"><i class="fas fa-book-reader"></i> Read Online</a>
                        <a href="#" id="modal-download-btn" class="btn outline" download><i class="fas fa-download"></i> Download</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="box-container">
            <div class="box">
                <h3>Bookly</h3>
                <div class="social-icons">
                    <a href="#"><i class="fab fa-instagram"></i></a>
                    <a href="#" title="Stardance"><i class="fas fa-star"></i></a>
                    <a href="#"><i class="fab fa-github"></i></a>
                    <a href="#"><i class="fab fa-discord"></i></a>
                </div>
            </div>
        </div>
        <div class="credit">Created by Srijit Banerjee | All Rights Reserved</div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
